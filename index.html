<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gpa/planner</title>
<meta name="description" content="Plan the grades you need for the GPA you want. Import syllabus or Moodle grades. Local only.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <section>
      <h3 class="sec"><b>01</b>Overview</h3>
      <div class="strip" id="strip"></div>
      <div class="legend" id="legend" role="note"></div>
    </section>
    <section>
      <h3 class="sec"><b>02</b>Course</h3>
      <div id="cv"></div>
    </section>
    <section>
      <h3 class="sec"><b>03</b>Cumulative</h3>
      <div id="cg"></div>
    </section>
    <p class="foot" id="foot"></p>
  </main>
</div>
<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-head"><h2 id="dlgTitle"></h2><button class="x" id="dlgX" aria-label="Close">×</button></div>
  <div id="dlgBody"></div>
</dialog>
<dialog id="pal" aria-label="Command search">
  <input id="palQ" autocomplete="off" spellcheck="false" placeholder="Jump to a course or run an action" aria-label="Search">
  <ul id="palL" role="listbox"></ul>
</dialog>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
