<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPA Planner</title>
<meta name="description" content="Plan the grades you need for the GPA you want. Import syllabi, scans and Moodle grades. Everything stays on your device.">
<link rel="stylesheet" href="style.css?v=3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#18181b">
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <section>
      <div class="tbar" id="tbar"></div>
      <div class="strip" id="strip"></div>
      <div class="legend" id="legend" role="note"></div>
    </section>
    <section id="cv"></section>
    <section>
      <h2 class="h2">Cumulative GPA</h2>
      <div id="cg"></div>
    </section>
    <p class="foot" id="foot"></p>
  </main>
</div>
<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-head"><h2 id="dlgTitle"></h2><button class="x" id="dlgX" aria-label="Close">×</button></div>
  <div id="dlgBody"></div>
</dialog>
<dialog id="pal" aria-label="Command search">
  <input id="palQ" autocomplete="off" spellcheck="false" placeholder="Jump to a course or run an action" aria-label="Search">
  <ul id="palL" role="listbox"></ul>
</dialog>
<script src="core.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
